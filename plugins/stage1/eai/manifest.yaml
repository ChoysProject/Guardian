name: eai
stage: 1
version: "1.0"
type: rules
enabled: true
system: eai
system_label: EAI
label: EAI (Inzent)
description: >
  인젠트 EAI 솔루션 로그. 서버에서 이 시스템을 고르면 이름과 관계없이 적용된다.
  어댑터·채널 실패, INZENT/iMAP 오류 문구를 찾는다.
targets: ["eai-.*", "EAI-.*"]
rules:
  - pattern: "Adapter .* failed|adapter error"
    severity: error
    signature: eai.adapter_failed
    min_count: 1
  - pattern: "Channel .* down|channel closed unexpectedly"
    severity: error
    signature: eai.channel_down
    min_count: 1
  - pattern: "Transaction timeout|tx timeout"
    severity: error
    signature: eai.tx_timeout
    min_count: 1
  - pattern: "Queue full|enqueue failed"
    severity: warn
    signature: eai.queue_backlog
    min_count: 2
  - pattern: "INZENT.*(error|fail|exception)|i-?MAP.*(error|fail|exception)"
    severity: error
    signature: eai.inzent
    min_count: 1
  - pattern: "인터페이스 (오류|실패)|EAI[-_ ]?\\d{3,}"
    severity: error
    signature: eai.error_code
    min_count: 1
