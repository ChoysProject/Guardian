name: mci
stage: 1
version: "1.0"
type: rules
enabled: true
system: mci
system_label: MCI
label: MCI
description: >
  MCI 대외인터페이스 로그. 서버에서 이 시스템을 고르면 이름과 관계없이 적용된다.
  MCI 012 같은 오류코드, 전문 매핑 실패, 타임아웃을 찾는다.
targets: ["mci-.*", "MCI-.*"]
rules:
  - pattern: "MCI\\s*0*12\\b"
    severity: error
    signature: mci.code_012
    min_count: 1
  - pattern: "MCI\\s*\\d{3}\\b"
    severity: error
    signature: mci.error_code
    min_count: 1
  - pattern: "mapping (error|failed)|변환 실패"
    severity: error
    signature: mci.mapping_failed
    min_count: 1
  - pattern: "interface timeout|전문 타임아웃"
    severity: error
    signature: mci.timeout
    min_count: 1
  - pattern: "response code ?= ?(?!000|00)\\d+"
    severity: warn
    signature: mci.bad_response
    min_count: 1
  - pattern: "connection reset by peer|대외기관 연결 실패"
    severity: error
    signature: mci.peer_reset
    min_count: 1
