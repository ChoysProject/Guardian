name: springboot
stage: 1
version: "1.0"
type: rules
enabled: true
system: app
system_label: 애플리케이션
label: Spring Boot
description: Spring 기동 실패·커넥션풀 고갈 같은 프레임워크 로그. 세션 만료·힙 부족처럼 이 서버만의 오류는 2단계 세부 에러 플러그인에 넣습니다.
targets: ["spring-.*", "boot-.*", "app-.*"]
rules:
  - pattern: "APPLICATION FAILED TO START|Error starting ApplicationContext"
    severity: error
    signature: spring.boot_failed
    min_count: 1
  - pattern: "HikariPool|Could not get JDBC connection|Connection is not available"
    severity: error
    signature: spring.pool_exhausted
    min_count: 1
  - pattern: "Exception|ERROR .*org\\.springframework"
    severity: error
    signature: spring.exception
    min_count: 3
