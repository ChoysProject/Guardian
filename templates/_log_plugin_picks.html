<div class="col-12 mb-3">
  <label class="small mb-1">{{ pick_title }}</label>
  <p class="small text-muted mb-2">{{ pick_help }}</p>
  {% if pick_extra %}
  <div class="mb-2">{{ pick_extra | safe }}</div>
  {% endif %}
  {% for _system, label, items in pick_groups %}
  <div class="small fw-semibold mt-3 mb-1">{{ label }}</div>
  <div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-2">
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          name="{{ pick_name }}"
          value="{{ item.name }}"
          id="{{ pick_id }}-lp-{{ item.name }}"
          {% if item.name in pick_chosen %}checked{% endif %}
        >
        <label class="form-check-label" for="{{ pick_id }}-lp-{{ item.name }}">{{ item.label or item.name }}</label>
        <div class="small text-muted">{{ item.description }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="small text-muted">{{ pick_empty | default("아직 없습니다.") }}</div>
  {% endfor %}
</div>
