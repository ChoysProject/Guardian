{% extends "base.html" %}
{% set title = report.title %}
{% set heading = report.title %}
{% block content %}
<div class="card mb-4">
  <div class="card-header">요약</div>
  <div class="card-body">
    <div class="text-muted small mb-2">{{ report.plugin }} · {{ report.period_start }} ~ {{ report.period_end }}</div>
    <p class="mb-3">{{ report.summary }}</p>
    <form method="post" action="/reports/{{ report.id }}/delete" onsubmit="return confirm('이 보고서를 삭제할까요?');">
      <button class="btn btn-sm btn-outline-danger" type="submit">보고서 삭제</button>
    </form>
  </div>
</div>
<div class="card mb-4">
  <div class="card-header">HTML</div>
  <div class="card-body p-2">
    <iframe class="guardian-report-frame" srcdoc="{{ html | e }}"></iframe>
  </div>
</div>
<div class="card mb-4">
  <div class="card-header">Markdown</div>
  <div class="card-body">
    <pre class="guardian-log">{{ markdown }}</pre>
  </div>
</div>
{% endblock %}
